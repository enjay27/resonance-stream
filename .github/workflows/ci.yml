name: CI

# Branch pushes are covered by their pull_request run; push only runs on main.
# Docs and other non-source files don't need the gates.
on:
  push:
    branches: [main]
    paths-ignore: &non-source
      - '**.md'
      - 'docs/**'
      - '.memory/**'
      - 'LICENSE*'
  pull_request:
    paths-ignore: *non-source

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    name: core + ui gates (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just fmt-check
      - run: just core-check
      - run: just ui-check

  app:
    name: app gate (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      # tauri::generate_context! needs frontendDist to exist; the gate checks
      # the backend, so a placeholder stands in for `trunk build`.
      - name: Placeholder frontend dist
        shell: bash
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - run: just app-check
