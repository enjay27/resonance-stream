[package]
name = "resonance-stream"
version.workspace = true
authors = ["Enjay27 <kdkm2002@gmail.com>"]
description = "Blue Protocol: Star Resonance Real-time Translator"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "resonance_stream_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
resonance-core = { path = "../crates/core" }
resonance-types = { path = "../crates/types" }
tauri = { version = "2", features = ["unstable", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util"] }
reqwest = { version = "0.11", features = ["stream", "json", "blocking", "rustls-tls"] }
futures-util = "0.3"
tauri-plugin-fs = "2.4.5" # For handling the download stream
# Network & Parsing
byteorder = "1.5"  # For reading u16/u32 from packets
is_elevated = "0.1"
crossbeam-channel = "0.5"    # Blazing fast thread queues
parking_lot = "0.12"         # Mutex/RwLock without poisoning

# Cryptography (Matches BPSR-ZDPS logic)
aes = "0.8"
ctr = "0.9"
hex = "0.4"
chrono = "0.4.43"
local-ip-address = "0.6.10"
lazy_static = "1.5.0"
windows-sys = "0.61.2"
socket2 = "0.6.2"
log = "0.4.29"
env_logger = "0.11"
zip = "8.1.0"
serde_with = "3.17.0"
tauri-plugin-global-shortcut = "2.3.1"

[dev-dependencies]
pnet = "0.35"
serde_json = "1.0"
